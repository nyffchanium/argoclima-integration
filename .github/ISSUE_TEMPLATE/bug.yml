name: Bug report
description: Report a problem with the integration
labels: bug
body:
  - type: markdown
    attributes:
      value: Please search the [existing issues](https://github.com/nyffchanium/argoclima-integration/issues) first.
  - type: input
    attributes:
      label: Integration version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Setup
      options:
        - Device only (polling)
        - Device with dummy server
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the issue
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
  - type: textarea
    attributes:
      label: Diagnostics
      description: |
        Settings → Devices & services → Argoclima → ⋮ → Download diagnostics, then drag the file here.
  - type: textarea
    attributes:
      label: Debug logs
      description: |
        Enable debug logging, reproduce the issue and paste the relevant log lines:
        ```yaml
        logger:
          logs:
            custom_components.argoclima: debug
        ```
      render: text
